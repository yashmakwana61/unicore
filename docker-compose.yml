services:
  web:
    build: .
    depends_on:
      - db
    ports:
      - "8069:8069"
      - "8071:8071"
      - "8072:8072"
    volumes:
      - ./custom_addons:/mnt/extra-addons
      - ./config/odoo-staging.conf:/etc/odoo/odoo.conf
      - odoo-web-data:/var/lib/odoo
    environment:
      - HOST=db
      - USER=${OACIS_DB_USER:-odoo}
      - PASSWORD=${OACIS_DB_PASSWORD:-odoo}
    command: odoo -c /etc/odoo/odoo.conf -d oacis -i oacis_design,muk_web_chatter,oacis_base,muk_web_dialog,muk_web_colors,muk_web_refresh,muk_web_appsbar,muk_web_group,telegram_odoo_integration,oacis_security,oacis_ai,muk_web_theme,oacis_campus,oacis_academic_generic,oacis_institution_profile,oacis_academic,oacis_calendar,oacis_student,oacis_placement,oacis_alumni,oacis_convocation,oacis_hostel,oacis_faculty_profile,oacis_quiz,oacis_transport,oacis_thesis,oacis_library,oacis_mentor,oacis_asset_request,oacis_guardian,oacis_discipline,oacis_skill_assessment,oacis_appointment,oacis_curriculum,oacis_transport_fleet,oacis_digital_library,oacis_notice_board,oacis_timetable,oacis_admission,oacis_attendance,oacis_website,oacis_crm,oacis_documents,oacis_exam,oacis_grading,oacis_fees,oacis_progression,oacis_secure_transcript,oacis_scholarship,oacis_notify,oacis_analytics,oacis_finance_report,oacis_assignment,oacis_api,oacis_portal_student,oacis_gradebook,oacis_payment,oacis_portal_faculty,oacis_portal_guardian,oacis_lms,oacis_grievance,oacis_student_leave

  db:
    image: postgres:16
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=${OACIS_DB_PASSWORD:-odoo}
      - POSTGRES_USER=${OACIS_DB_USER:-odoo}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - odoo-db-data:/var/lib/postgresql/data/pgdata

volumes:
  odoo-web-data:
  odoo-db-data:
