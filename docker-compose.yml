# EDICAI - Odoo 19 production deployment
# Usage:
#   Production (image-baked addons):      docker compose up -d
#   With HTTPS reverse proxy (recommended): docker compose --profile proxy up -d
#   Dev (live-mounted addons):            docker compose --profile dev up -d web-dev
#
# All secrets/values come from .env (see .env.example). Never commit .env.

x-odoo-env: &odoo-env
  HOST: db
  PORT: "5432"
  USER: ${EDICAI_DB_USER:-odoo}
  PASSWORD: ${EDICAI_DB_PASSWORD:?Set EDICAI_DB_PASSWORD in .env}

services:
  web:
    build: .
    image: edicai-odoo:19
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Expose only on localhost when the Caddy proxy profile is used.
    ports:
      - "${HTTP_BIND:-127.0.0.1}:8069:8069"
      - "${HTTP_BIND:-127.0.0.1}:8072:8072"
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./config/odoo-prod.conf:/etc/odoo/odoo.conf:ro
    environment: *odoo-env
    command: odoo -c /etc/odoo/odoo.conf -d ${EDICAI_DB_NAME:-edicai}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:8069/web/login || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${EDICAI_DB_USER:-odoo}
      POSTGRES_PASSWORD: ${EDICAI_DB_PASSWORD:?Set EDICAI_DB_PASSWORD in .env}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - odoo-db-data:/var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${EDICAI_DB_USER:-odoo} -d ${POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Automatic HTTPS reverse proxy (Let's Encrypt). Enable with --profile proxy.
  # Set DOMAIN=your.domain.com in .env first.
  caddy:
    image: caddy:2
    restart: unless-stopped
    profiles: ["proxy"]
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}

  # Dev variant: live-mounts custom_addons so edits apply on upgrade.
  web-dev:
    build: .
    image: edicai-odoo:19
    restart: unless-stopped
    profiles: ["dev"]
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8069:8069"
      - "8072:8072"
    volumes:
      - ./custom_addons:/mnt/extra-addons
      - ./config/odoo-dev.conf:/etc/odoo/odoo.conf:ro
      - odoo-web-data:/var/lib/odoo
    environment: *odoo-env
    command: odoo -c /etc/odoo/odoo.conf -d ${EDICAI_DB_NAME:-edicai}

volumes:
  odoo-web-data:
  odoo-db-data:
  caddy-data:
  caddy-config:
