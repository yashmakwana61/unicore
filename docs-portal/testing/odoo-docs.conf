[options]
; Only for synthetic Edicai documentation testing.
; DB credentials are injected by the official Odoo Docker entrypoint.
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons
data_dir = /var/lib/odoo
db_host = database
db_port = 5432
db_name = edicai_docs_test
dbfilter = ^edicai_docs_test$
list_db = False
admin_passwd = False
workers = 0
max_cron_threads = 0
proxy_mode = False
without_demo = False
log_level = warn
http_interface = 0.0.0.0
http_port = 8069
limit_memory_soft = 1610612736
limit_memory_hard = 2684354560
limit_time_cpu = 120
limit_time_real = 240
