name: Edicai Documentation
on:
  pull_request:
    paths: ['docs-portal/**', 'custom_addons/**', '.github/workflows/clasflow-docs.yml']
  push:
    branches: [main]
    paths: ['docs-portal/**', 'custom_addons/**', '.github/workflows/clasflow-docs.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & validate documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: Check module parity
        run: python3 docs-portal/engine/audit.py --check
      - name: Test extractors
        run: cd docs-portal/engine && python3 -m unittest discover -v -p 'test_*.py'
      - name: Generate deep source feature inventory
        run: python3 docs-portal/engine/feature_intelligence.py --output docs-portal/audit
      - name: Store audit evidence separately from public website
        uses: actions/upload-artifact@v4
        with:
          name: edicai-feature-audit
          path: docs-portal/audit/
      - name: Install dependencies
        working-directory: docs-portal
        run: npm install --no-audit --no-fund
      - name: Build docs
        working-directory: docs-portal
        run: npm run build
      - name: Protect git metadata when served from Hostinger
        run: |
          cat > docs-portal/build/.htaccess <<'EOT'
          <IfModule mod_rewrite.c>
          RewriteEngine On
          RewriteRule (^|/)\.git(/|$) - [F,L,NC]
          </IfModule>
          <IfModule mod_autoindex.c>
          Options -Indexes
          </IfModule>
          EOT
      - uses: actions/upload-artifact@v4
        with: {name: edicai-docs-site, path: docs-portal/build, include-hidden-files: true}

  publish-static:
    name: Publish public build to isolated Git branch
    needs: build
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'docs/clasflow-portal-initial' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: edicai-docs-site
          path: compiled-site
      - name: Publish compiled files only
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: edicai-docs-static
          publish_dir: ./compiled-site
          force_orphan: true
          enable_jekyll: false
          commit_message: 'Deploy Edicai static documentation'
