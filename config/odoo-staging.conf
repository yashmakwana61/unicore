[options]
addons_path = /mnt/extra-addons
; Override locally with an untracked file if you need the DB manager.
admin_passwd = False
http_port = 8069
log_handler = :INFO
log_level = info
limit_request = 65536
limit_time_cpu = 600
limit_time_real = 1200
max_cron_threads = 2

; Restrict reachable databases on shared hosts.
list_db = False
db_filter = ^edicai.*$

# Staging specific
workers = 0
