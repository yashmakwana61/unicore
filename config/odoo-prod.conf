[options]
addons_path = /mnt/extra-addons
; admin_passwd = False disables the database manager screens
; entirely (recommended behind a reverse proxy). If you must
; use them, set a pbkdf2 hash in an untracked local override.
admin_passwd = False
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo
http_port = 8069
log_handler = :INFO
log_level = info
limit_request = 8192
limit_time_cpu = 600
limit_time_real = 1200
max_cron_threads = 2

; Hardening: never expose the database list or manager in prod.
list_db = False
db_filter = ^oacis.*$
db_name = oacis

; Session hardening
proxy_mode = True

# Prod specific
workers = 4
log_db_level = warning
