[options]
addons_path = /mnt/extra-addons
; Dev only. Override locally if needed - do not commit real passwords.
admin_passwd = False
http_port = 8069
log_handler = :INFO
log_level = info
limit_request = 65536
limit_time_cpu = 600
limit_time_real = 1200
max_cron_threads = 1

# Dev specific
dev_mode = all
workers = 0
